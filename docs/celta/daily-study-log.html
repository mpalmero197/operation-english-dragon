<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily study log</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --border:#2d3a4f; --text:#e8eef7; --muted:#8b9bb4; --accent:#7c9cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); padding:1.25rem; max-width:720px; margin-inline:auto; line-height:1.45; }
  a { color:var(--accent); } h1 { font-size:1.15rem; margin:0 0 .35rem; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 1rem; }
  .back { display:inline-block; margin-bottom:1rem; color:var(--muted); text-decoration:none; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:.65rem 0 .2rem; }
  input, textarea { width:100%; background:#141c28; border:1px solid var(--border); border-radius:8px; color:var(--text); padding:.55rem .65rem; font:inherit; }
  textarea { min-height:4.5rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; margin:.75rem 0; }
  th, td { border:1px solid var(--border); padding:.45rem .5rem; vertical-align:top; }
  th { background:var(--card); text-align:left; color:var(--muted); font-weight:600; }
  .tip { font-size:.85rem; color:var(--muted); margin-top:1rem; }
  ul.check { padding-left:1.1rem; } li { margin:.35rem 0; }
  @media print { body { background:#fff; color:#000; } input, textarea { border:1px solid #999; } }
</style>
</head>
<body>
<a class="back" href="index.html">← CELTA docs</a>

<h1>Daily study log</h1>
<p class="sub">Michael · noon CT lunch target · fill on phone, Print → Save PDF, or screenshot for Coco.</p>
<label>Date</label><input placeholder="YYYY-MM-DD" />
<label>Clock in (CT)</label><input placeholder="12:00" />
<label>Clock out (CT)</label><input placeholder="13:15" />
<label>Minutes (match Study Clock)</label><input placeholder="75" />
<label>What I covered</label><textarea placeholder="Lesson 01 tasks 1–2, glossary…"></textarea>
<label>Stuck on / ask Motivational Expert</label><textarea placeholder="CCQs for present perfect…"></textarea>
<p class="tip">Weekdays: if you skip lunch check-in, the app locks lanes on purpose. No silent skips.</p>
</body></html>
